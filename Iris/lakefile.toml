name = "iris"
defaultTargets = ["Iris", "IrisTest"]
lintDriver = "batteries/runLinter"

[[require]]
name = "Qq"
scope = "leanprover-community"
rev = "v4.32.0"

[[require]]
name = "batteries"
scope = "leanprover-community"
rev = "v4.32.0"

[[lean_lib]]
name = "Iris"

[[lean_lib]]
name = "IrisTest"
globs = ["Iris.*"]

[[lean_exe]]
name = "dumpPortingData"
srcDir = "Iris/Std"
root = "DumpPortingData"
supportInterpreter = true

[leanOptions]
linter.all = true
linter.extra = true
linter.missingDocs = false
